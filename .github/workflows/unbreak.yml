# Unbreak: fixes a failing dependency-update PR inside your own GitHub Actions,
# on your own Anthropic account. Copy this file to .github/workflows/unbreak.yml
# on your default branch. The Unbreak GitHub App dispatches it when someone with
# write access presses "Unbreak this" on a red Dependabot or Renovate PR.
#
# What runs here is the @unbrkn/agent package, downloaded below and checked
# against a pinned SHA-256, source included. Read it. Nothing else runs.
# Nothing in this job talks to Unbreak's servers except two calls with this
# job's OIDC token: one to fetch a repo-scoped App token (so the fix can be
# pushed and CI re-runs), one to post report.json at the end.
#
# Every step keeps its output in a step log. If a step fails before the agent
# writes report.json, the final step names that step and quotes its output in
# the check run. The agent itself writes report.json on every exit, including a
# crash, with the error inside.
#
# Anthropic credentials, in order of preference:
#   1. Workload identity federation: set repository variables
#      ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
#      ANTHROPIC_SERVICE_ACCOUNT_ID (and ANTHROPIC_WORKSPACE_ID if the rule
#      spans workspaces). No key is stored anywhere; spend shows in your console.
#   2. Fallback: repository secret ANTHROPIC_API_KEY.
name: Unbreak

on:
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: string
      sha:
        description: PR head commit to fix
        required: true
        type: string
      package:
        description: Package being bumped
        required: true
        type: string
      directory:
        description: Directory of the manifest, repo-relative ("" for the root; Dependabot's "in /packages/api")
        required: false
        default: ""
        type: string
      api_url:
        description: Unbreak backend that receives the report
        required: true
        type: string

permissions:
  # Two OIDC tokens: audience "unbreak" for the App token and the report,
  # audience "https://api.anthropic.com" for identity federation.
  id-token: write
  # Read is enough to fetch this workflow. Code is checked out and pushed with
  # the App installation token, never with GITHUB_TOKEN (it would not re-run CI).
  contents: read

concurrency:
  group: unbreak-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  fix:
    name: fix ${{ inputs.package }} on PR #${{ inputs.pr }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PR: ${{ inputs.pr }}
      SHA: ${{ inputs.sha }}
      PACKAGE: ${{ inputs.package }}
      DIRECTORY: ${{ inputs.directory }}
      API_URL: ${{ inputs.api_url }}
    steps:
      - name: Step log (each step's output is kept so a failure can be quoted in the check run)
        id: trace
        run: |
          set -euo pipefail
          # The runner context is not available in job-level env, so the paths are exported here.
          STEP_LOG="$RUNNER_TEMP/unbreak-steps.log"; TRACE="$RUNNER_TEMP/unbreak-trace.sh"
          echo "STEP_LOG=$STEP_LOG" >> "$GITHUB_ENV"
          echo "TRACE=$TRACE" >> "$GITHUB_ENV"
          cat > "$TRACE" <<'SH'
          # source "$TRACE" <step id>: marks the step in $STEP_LOG and tees its output there.
          # ::add-mask:: lines carry the raw secret to the runner; they never reach the file.
          echo "### step ${1:-unknown}" >> "$STEP_LOG"
          exec > >(tee >(grep --line-buffered -v '::add-mask::' >> "$STEP_LOG")) 2>&1
          SH
          : > "$STEP_LOG"

      - name: Get a repo-scoped Unbreak App token (OIDC, no secret)
        id: app
        run: |
          source "$TRACE" app
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=unbreak" | jq -r .value)
          echo "::add-mask::$OIDC"
          RESP=$(curl -sSf -X POST "$API_URL/api/runs/token" \
            -H "Authorization: Bearer $OIDC" -H "content-type: application/json" \
            -d "$(jq -n --arg sha "$SHA" '{sha: $sha}')")
          TOKEN=$(jq -r .token <<< "$RESP")
          RUN_TOKEN=$(jq -r .run_token <<< "$RESP")
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$RUN_TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          # The App's own bot identity for the fix commit, so it carries the App's avatar.
          echo "bot_name=$(jq -r '.bot.name // empty' <<< "$RESP")" >> "$GITHUB_OUTPUT"
          echo "bot_email=$(jq -r '.bot.email // empty' <<< "$RESP")" >> "$GITHUB_OUTPUT"
          # The run token lets the agent fetch its skill from Unbreak. Skills are
          # proprietary; the one used is written in full into the transcript.
          echo "run_token=$RUN_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Look up the PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          source "$TRACE" pr
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > pr.json
          echo "head_ref=$(jq -r .head.ref pr.json)" >> "$GITHUB_OUTPUT"
          echo "base_sha=$(jq -r .base.sha pr.json)" >> "$GITHUB_OUTPUT"

      - name: Check out the PR head (App token)
        id: checkout_head
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
          path: head
          token: ${{ steps.app.outputs.token }}

      - name: Check out the base (App token)
        id: checkout_base
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.base_sha }}
          path: base
          token: ${{ steps.app.outputs.token }}

      - name: Project directories (the manifest may live below the repo root)
        id: dirs
        run: |
          source "$TRACE" dirs
          set -euo pipefail
          DIR="${DIRECTORY#/}"; DIR="${DIR%/}"
          echo "head=head${DIR:+/$DIR}" >> "$GITHUB_OUTPUT"
          echo "base=base${DIR:+/$DIR}" >> "$GITHUB_OUTPUT"
          echo "project=${DIR:-.}" >> "$GITHUB_OUTPUT"

      - name: Node version (.nvmrc in the project, then the repo root, then 22)
        id: node
        env:
          HEAD_DIR: ${{ steps.dirs.outputs.head }}
        run: |
          source "$TRACE" node
          if [ -f "$HEAD_DIR/.nvmrc" ]; then echo "version=$(cat "$HEAD_DIR/.nvmrc")" >> "$GITHUB_OUTPUT"
          elif [ -f head/.nvmrc ]; then echo "version=$(cat head/.nvmrc)" >> "$GITHUB_OUTPUT"
          else echo "version=22" >> "$GITHUB_OUTPUT"; fi

      - name: Package manager (from the project's lockfile, then the repo root; npm when there is none)
        id: pm
        env:
          HEAD_DIR: ${{ steps.dirs.outputs.head }}
        run: |
          source "$TRACE" pm
          set -euo pipefail
          # The customer's package manager is whatever their lockfile says; the install and test commands follow it.
          # pnpm's version comes from packageManager or engines.pnpm (pnpm/action-setup refuses to guess); npm and yarn ship with Node.
          PM=npm; INSTALL="npm install"; TEST="npm test"
          for d in "$HEAD_DIR" head; do
            if [ -f "$d/pnpm-lock.yaml" ]; then PM=pnpm; INSTALL="pnpm install --frozen-lockfile"; TEST="pnpm test"; break; fi
            if [ -f "$d/yarn.lock" ]; then PM=yarn; if [ -f "$d/.yarnrc.yml" ]; then INSTALL="yarn install --immutable"; else INSTALL="yarn install --frozen-lockfile"; fi; TEST="yarn test"; break; fi
            if [ -f "$d/package-lock.json" ]; then PM=npm; INSTALL="npm ci"; TEST="npm test"; break; fi
          done
          PNPM_VERSION=""
          if [ "$PM" = pnpm ]; then
            PNPM_VERSION=$(node -e '
              const fs = require("fs");
              const read = (p) => { try { return JSON.parse(fs.readFileSync(p, "utf8")); } catch { return {}; } };
              const pm = (m) => typeof m.packageManager === "string" && m.packageManager.startsWith("pnpm@") ? m.packageManager.slice(5).split("+")[0] : null;
              const project = read(process.argv[1] + "/package.json");
              const root = read("head/package.json");
              const engines = (m) => (m.engines && typeof m.engines.pnpm === "string" ? m.engines.pnpm : null);
              console.log(pm(project) || pm(root) || engines(project) || engines(root) || "latest");
            ' "$HEAD_DIR")
          fi
          echo "$PM (install: $INSTALL; test: $TEST${PNPM_VERSION:+; pnpm@$PNPM_VERSION})"
          echo "pm=$PM" >> "$GITHUB_OUTPUT"
          echo "install_cmd=$INSTALL" >> "$GITHUB_OUTPUT"
          echo "test_cmd=$TEST" >> "$GITHUB_OUTPUT"
          echo "pnpm_version=$PNPM_VERSION" >> "$GITHUB_OUTPUT"

      - id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Install pnpm (only when the project uses it)
        id: pnpm
        if: steps.pm.outputs.pm == 'pnpm'
        env:
          PNPM_VERSION: ${{ steps.pm.outputs.pnpm_version }}
        run: |
          source "$TRACE" pnpm
          set -euo pipefail
          npm install -g "pnpm@$PNPM_VERSION" --no-fund --no-audit --loglevel=error
          pnpm --version

      - name: pnpm store path
        id: pnpm_store
        if: steps.pm.outputs.pm == 'pnpm'
        run: |
          source "$TRACE" pnpm_store
          set -euo pipefail
          echo "store=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: pnpm store cache (keyed on the lockfile)
        id: cache
        if: steps.pm.outputs.pm == 'pnpm'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm_store.outputs.store }}
          key: unbreak-pnpm-${{ runner.os }}-${{ hashFiles(format('{0}/pnpm-lock.yaml', steps.dirs.outputs.head), format('{0}/pnpm-lock.yaml', steps.dirs.outputs.base)) }}
          restore-keys: |
            unbreak-pnpm-${{ runner.os }}-

      - name: Install (base must install; a head that does not is the failure the agent fixes)
        id: install
        env:
          HEAD_DIR: ${{ steps.dirs.outputs.head }}
          BASE_DIR: ${{ steps.dirs.outputs.base }}
          INSTALL_CMD: ${{ steps.pm.outputs.install_cmd }}
        run: |
          source "$TRACE" install
          set -euo pipefail
          (cd "$BASE_DIR" && $INSTALL_CMD)
          # The peer-conflict lane: an ERESOLVE (or unmet peer) on the head is what most red Dependabot PRs are.
          # Its output goes to a file the agent reads; the agent installs again after its fix.
          if ! (cd "$HEAD_DIR" && $INSTALL_CMD 2>&1 | tee "$RUNNER_TEMP/unbreak-head-install.log"; test "${PIPESTATUS[0]}" -eq 0); then
            echo "head install failed; the agent takes it from here (log: $RUNNER_TEMP/unbreak-head-install.log)"
          else
            rm -f "$RUNNER_TEMP/unbreak-head-install.log"
          fi

      - name: Anthropic credentials (identity federation preferred, API key fallback)
        id: anthropic
        env:
          FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          source "$TRACE" anthropic
          set -euo pipefail
          if [ -n "$FEDERATION_RULE_ID" ] && [ -n "$ORGANIZATION_ID" ]; then
            JWT=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" | jq -r .value)
            echo "::add-mask::$JWT"
            BODY=$(jq -n --arg a "$JWT" --arg r "$FEDERATION_RULE_ID" --arg o "$ORGANIZATION_ID" \
              --arg s "$SERVICE_ACCOUNT_ID" --arg w "$WORKSPACE_ID" \
              '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer", assertion: $a, federation_rule_id: $r, organization_id: $o}
               + (if $s != "" then {service_account_id: $s} else {} end)
               + (if $w != "" then {workspace_id: $w} else {} end)')
            ACCESS=$(curl -sSf -X POST "https://api.anthropic.com/v1/oauth/token" \
              -H "content-type: application/json" \
              -H "anthropic-beta: oauth-2025-04-20,oidc-federation-2026-04-01" \
              -d "$BODY" | jq -r .access_token)
            echo "::add-mask::$ACCESS"
            echo "ANTHROPIC_AUTH_TOKEN=$ACCESS" >> "$GITHUB_ENV"
            echo "mode=federation" >> "$GITHUB_OUTPUT"
          elif [ -n "$API_KEY" ]; then
            echo "ANTHROPIC_API_KEY=$API_KEY" >> "$GITHUB_ENV"
            echo "mode=api_key" >> "$GITHUB_OUTPUT"
            CRED_HEADER="x-api-key: $API_KEY"
          else
            echo "::error::No Anthropic credential. Set the ANTHROPIC_FEDERATION_RULE_ID / ANTHROPIC_ORGANIZATION_ID / ANTHROPIC_SERVICE_ACCOUNT_ID repository variables (preferred) or the ANTHROPIC_API_KEY secret."
            exit 1
          fi
          # Prove the credential before the agent spends a turn on it: one cheap models
          # call. A rejected credential fails here with the API's own error text, not
          # as a synthetic "Invalid API key" turn inside the agent. The key itself is
          # never printed.
          : "${CRED_HEADER:=Authorization: Bearer $ACCESS}"
          CHECK=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 "https://api.anthropic.com/v1/models?limit=1" \
            -H "$CRED_HEADER" -H "anthropic-version: 2023-06-01")
          if [ "$CHECK" != "200" ]; then
            DETAIL=$(curl -s --max-time 30 "https://api.anthropic.com/v1/models?limit=1" -H "$CRED_HEADER" -H "anthropic-version: 2023-06-01" | jq -r '.error.type + ": " + .error.message' 2>/dev/null || true)
            SHAPE=""
            if [ -n "${API_KEY:-}" ]; then
              case "$API_KEY" in sk-ant-*) PREFIX=yes ;; *) PREFIX=no ;; esac
              SHAPE=" The ANTHROPIC_API_KEY secret is ${#API_KEY} characters long and starts with sk-ant-: $PREFIX."
            fi
            echo "::error::Anthropic rejected the credential (HTTP $CHECK). ${DETAIL:-no detail}.${SHAPE} Check the ANTHROPIC_API_KEY secret (or the federation variables) in this repository's settings."
            exit 1
          fi
          echo "credential accepted by api.anthropic.com (HTTP 200)"

      - name: Fetch the pinned Unbreak agent and check its sha256
        id: agent_fetch
        env:
          # The agent is Apache-2.0 and public; the pin is what makes "what ran" provable.
          # Override both with repository variables to move to a newer release.
          AGENT_URL: ${{ vars.UNBREAK_AGENT_URL || format('{0}/releases/unbrkn-agent-0.1.4.tgz', inputs.api_url) }}
          AGENT_SHA256: ${{ vars.UNBREAK_AGENT_SHA256 || '66ee4ce56f682b933531a3e15736c90766bf0d3aae3231e23c652bd4ada31e4a' }}
        run: |
          source "$TRACE" agent_fetch
          set -euo pipefail
          curl -sSfL "$AGENT_URL" -o agent.tgz
          echo "$AGENT_SHA256  agent.tgz" | sha256sum -c -
          mkdir -p agent
          (cd agent && echo '{"name":"unbreak-agent-install","private":true}' > package.json && npm install --no-fund --no-audit --loglevel=error ../agent.tgz)

      - name: Run the Unbreak agent
        id: agent
        env:
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_DIR: ${{ steps.dirs.outputs.head }}
          BASE_DIR: ${{ steps.dirs.outputs.base }}
          UNBREAK_API_URL: ${{ inputs.api_url }}
          UNBREAK_RUN_TOKEN: ${{ steps.app.outputs.run_token }}
          INSTALL_CMD: ${{ steps.pm.outputs.install_cmd }}
          TEST_CMD: ${{ steps.pm.outputs.test_cmd }}
        run: |
          source "$TRACE" agent
          set -uo pipefail
          # The agent writes report.json on every exit, a crash included (outcome infra_error, the error inside).
          # unbreak.json test_command still wins over the package manager's default inside the agent.
          ./agent/node_modules/.bin/unbreak-agent run \
            --repo "$HEAD_DIR" --baseline "$BASE_DIR" \
            --install-cmd "$INSTALL_CMD" --test-cmd "$TEST_CMD" --head-install-log "$RUNNER_TEMP/unbreak-head-install.log" \
            --slug "$GITHUB_REPOSITORY" --pr "$PR" --sha "$SHA" --base-sha "$BASE_SHA" \
            --out report.json --transcript transcript.md --apply --quiet > /dev/null
          echo "exit=$?" >> "$GITHUB_OUTPUT"
          if [ -f report.json ]; then
            echo "outcome=$(jq -r .outcome report.json)" >> "$GITHUB_OUTPUT"
            echo "from=$(jq -r .package.from report.json)" >> "$GITHUB_OUTPUT"
            echo "to=$(jq -r .package.to report.json)" >> "$GITHUB_OUTPUT"
            jq -r '"Unbreak: \(.outcome), billable=\(.billable), regressions=\(.regressions | length), cost=$\(.cost.usd)" + (if .error then "\n\n```\n" + .error + "\n```" else "" end)' report.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report.json, the transcript and the step log
        id: upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unbreak-report-${{ inputs.sha }}
          path: |
            report.json
            transcript.md
            ${{ runner.temp }}/unbreak-steps.log
          if-no-files-found: ignore

      - name: Push the fix (App token, so CI re-runs)
        id: push
        if: steps.agent.outputs.outcome == 'green'
        working-directory: head
        env:
          HEAD_REF: ${{ steps.pr.outputs.head_ref }}
          FROM: ${{ steps.agent.outputs.from }}
          TO: ${{ steps.agent.outputs.to }}
          BOT_NAME: ${{ steps.app.outputs.bot_name || 'unbreak[bot]' }}
          BOT_EMAIL: ${{ steps.app.outputs.bot_email || 'unbreak[bot]@users.noreply.github.com' }}
        run: |
          source "$TRACE" push
          set -euo pipefail
          # Authored as the App's bot user (from the token response) so GitHub shows its avatar.
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -A
          # No "[dependabot skip]" in this message, ever: without it Dependabot
          # stops rebasing the branch, which is what keeps this fix in place.
          git commit -m "Unbreak: fix $PACKAGE $FROM -> $TO" \
            -m "Fixed by the Unbreak agent in this repository's Actions. The check run carries the report: tests passed before and after, flaky excluded, changed files with reasons, cost."
          git push origin "HEAD:refs/heads/$HEAD_REF"
          echo "fixed_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Report to Unbreak (updates the check run)
        id: report
        if: always()
        env:
          FIXED_SHA: ${{ steps.push.outputs.fixed_sha }}
          AGENT_EXIT: ${{ steps.agent.outputs.exit }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Outcome of every step above, by id. Only the outcomes are read.
          STEPS: ${{ toJSON(steps) }}
          STEP_NAMES: >-
            {"trace":"Step log","app":"Get a repo-scoped Unbreak App token","pr":"Look up the PR",
             "checkout_head":"Check out the PR head","checkout_base":"Check out the base",
             "dirs":"Project directories","node":"Node version","pm":"Package manager",
             "setup_node":"Set up Node","pnpm":"Install pnpm","pnpm_store":"pnpm store path",
             "cache":"pnpm store cache","install":"Install (base and head)","anthropic":"Anthropic credentials",
             "agent_fetch":"Fetch the pinned Unbreak agent","agent":"Run the Unbreak agent",
             "upload":"Upload the report","push":"Push the fix"}
        run: |
          set -euo pipefail
          OIDC=$(curl -sSf -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=unbreak" | jq -r .value)
          echo "::add-mask::$OIDC"
          if [ -f report.json ]; then
            BODY=$(jq -n --slurpfile r report.json --arg f "${FIXED_SHA:-}" --arg u "$RUN_URL" \
              '{report: $r[0], fixed_sha: (if $f == "" then null else $f end), report_url: $u}')
          else
            # No report: a step before the agent failed, or the job was killed. Name the
            # step and quote the tail of its output; "unknown" is not an answer.
            STEP=$(jq -r 'to_entries | map(select(.value.outcome == "failure")) | (.[0].key // "none")' <<< "$STEPS")
            NAME=$(jq -r --arg id "$STEP" '.[$id] // $id' <<< "$STEP_NAMES")
            ERR=""
            if [ -f "$STEP_LOG" ]; then
              ERR=$(awk -v id="$STEP" '$0 == "### step " id { on = 1; next } /^### step / { on = 0 } on' "$STEP_LOG" | tail -n 40 | cut -c1-300)
            fi
            if [ -z "$ERR" ]; then ERR="No output was captured for this step (an action, not a script). The workflow run has the log."; fi
            if [ "$STEP" = "none" ]; then
              REASON="no step reported a failure and the agent wrote no report (agent exit ${AGENT_EXIT:-not reached})"
            else
              REASON="step $STEP ($NAME) failed before the agent could write a report"
            fi
            BODY=$(jq -n --argjson pr "$PR" --arg sha "$SHA" --arg step "$STEP" --arg name "$NAME" --arg err "$ERR" --arg reason "$REASON" --arg u "$RUN_URL" \
              '{failed: {pr: $pr, head_sha: $sha, reason: $reason, step: $step, step_name: $name, error: $err[0:4000]}, report_url: $u}')
          fi
          curl -sSf -X POST "$API_URL/api/runs/complete" \
            -H "Authorization: Bearer $OIDC" -H "content-type: application/json" \
            -d "$BODY"
